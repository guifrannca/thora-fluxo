name: Deploy Thora to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build standalone responsive HTML with vertical mobile timeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat payload/part1.txt payload/part2.txt payload/part2b.txt payload/part3.txt payload/part4.txt | tr -d '\r\n ' | base64 --decode | gzip --decompress > dist/index.html
          test -s dist/index.html
          grep -q 'Da demanda à entrega' dist/index.html

          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/index.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              html = html.replace(old, new, 1)

          # Mobile gets a dedicated vertical scroll model. Desktop keeps the original timeline.
          replace_once(
              "  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;",
              "  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const mobileVertical = matchMedia('(max-width: 860px)').matches;",
              "mobile mode flag"
          )
          replace_once(
              "    total = acc; spacer.style.height = (total + vh) + 'px';",
              "    total = acc; spacer.style.height = mobileVertical ? '0px' : (total + vh) + 'px';",
              "vertical scroll height"
          )
          replace_once(
              "  let lastScene = -1;\n  nds.forEach(n => n.addEventListener('click', () => {\n    const i = +n.dataset.go; scrollTo({ top: i === 0 ? 0 : startOf(i) + 6, behavior: reduce ? 'auto' : 'smooth' });\n  }));",
              "  let lastScene = -1;\n  nds.forEach(n => n.addEventListener('click', () => {\n    const i = clamp(+n.dataset.go, 0, N - 1);\n    if (mobileVertical) {\n      const top = scenes[i].getBoundingClientRect().top + scrollY;\n      scrollTo({ top: Math.max(0, top - 8), behavior: reduce ? 'auto' : 'smooth' });\n    } else {\n      scrollTo({ top: i === 0 ? 0 : startOf(i) + 6, behavior: reduce ? 'auto' : 'smooth' });\n    }\n  }));",
              "mobile rail navigation"
          )

          mobile_renderer = r'''  let mobileLastScroll = 0;
          function renderMobile(y, t) {
            const scrollDelta = y - mobileLastScroll;
            mobileLastScroll = y;
            const starOffset = y * .22;
            root.style.setProperty('--cx', starOffset.toFixed(1));
            world.style.setProperty('--v', '0');
            drawStars(starOffset, reduce ? 0 : clamp(scrollDelta, -28, 28), t);

            let active = 0, closest = 0, closestDistance = Infinity, intersects = false;
            const focusY = vh * .42;

            for (let i = 0; i < N; i++) {
              const el = scenes[i];
              const rect = el.getBoundingClientRect();
              const top = rect.top + y;
              const height = Math.max(rect.height, 1);

              // Reveal the step in sync with actual vertical scroll, without long empty pauses.
              const p = i === 0 ? 1 : clamp((y + vh * .18 - top) / height);
              setP(i, p);
              el.style.visibility = 'visible';

              if (rect.top <= focusY && rect.bottom > focusY) {
                active = i;
                intersects = true;
              }
              const distance = focusY < rect.top ? rect.top - focusY :
                focusY > rect.bottom ? focusY - rect.bottom : 0;
              if (distance < closestDistance) {
                closestDistance = distance;
                closest = i;
              }
            }

            if (!intersects) active = closest;
            const rect = scenes[active].getBoundingClientRect();
            const top = rect.top + y;
            const height = Math.max(rect.height, 1);
            const local = active === 0 ? 0 : clamp((y + vh * .42 - top) / height);
            const camera = active === 0 ? 0 : (active - 1) + local;
            const frac = clamp(camera / (N - 1));

            fill.style.width = (frac * 100) + '%';
            orb.style.left = (frac * 100) + '%';
            nds.forEach((n, k) => {
              n.classList.toggle('act', k === active && k > 0);
              n.classList.toggle('done', k < active);
            });

            if (active !== lastScene) {
              lastScene = active;
              cName.textContent = NAMES[active];
              cNum.textContent = active === 0 ? 'Role para começar' :
                'Etapa ' + String(active).padStart(2, '0') + ' de 05';
              setDock(active);
            }
            hint.style.opacity = 0;
            ho.style.setProperty('--o', '0');
          }

          '''
          replace_once(
              "  /* ---------- loop principal ---------- */",
              mobile_renderer + "  /* ---------- loop principal ---------- */",
              "mobile vertical renderer"
          )
          replace_once(
              "  function render(y, t) {\n    const s = stateAt(y); if (!s) return;\n    const camPx = s.cam * vw;",
              "  function render(y, t) {\n    const s = stateAt(y); if (!s) return;\n    if (mobileVertical) { renderMobile(y, t); return; }\n    const camPx = s.cam * vw;",
              "renderer branch"
          )
          replace_once(
              "    cur += (target - cur) * (reduce ? 1 : .12);",
              "    cur += (target - cur) * (mobileVertical || reduce ? 1 : .12);",
              "scroll follows finger on mobile"
          )

          mobile_css = r'''<style id="thora-mobile-vertical">
          .mobile-nav { display:none!important; }
          @media (max-width:860px) {
            html { height:auto!important; min-height:100%; overflow-x:hidden!important; overflow-y:auto!important; scroll-behavior:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }
            body { height:auto!important; min-height:100%; overflow-x:hidden!important; overflow-y:visible!important; touch-action:pan-y; }
            .hud { position:fixed; top:0; left:0; right:0; }
            .stage { position:relative!important; inset:auto!important; width:100%!important; height:auto!important; min-height:0!important; overflow:visible!important; touch-action:pan-y!important; }
            .world { display:flex!important; flex-direction:column!important; width:100%!important; height:auto!important; transform:none!important; will-change:auto!important; }
            .scene { position:relative!important; display:flex!important; flex:0 0 auto!important; flex-direction:column!important; width:100%!important; height:auto!important; min-height:0!important; align-items:stretch!important; justify-content:flex-start!important; overflow:visible!important; padding:calc(var(--hud) + env(safe-area-inset-top,0px) + 20px) 0 20px!important; scroll-margin-top:calc(var(--hud) + env(safe-area-inset-top,0px) + 10px); visibility:visible!important; }
            .scene:not(:last-child)::after { content:"↓  PRÓXIMA ETAPA"; display:flex; align-items:center; justify-content:center; width:max-content; max-width:calc(100% - 28px); margin:18px auto 8px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; color:var(--vio2); background:color-mix(in srgb,var(--vio) 10%,var(--bg)); box-shadow:0 8px 24px -16px var(--glow); font:700 10px Sora,Manrope,sans-serif; letter-spacing:.07em; }
            .scene:last-child { padding-bottom:calc(104px + env(safe-area-inset-bottom,0px) + 16px)!important; }
            .wrap { width:calc(100% - 28px)!important; max-height:none!important; min-height:0!important; height:auto!important; flex:none!important; margin:0 auto!important; justify-content:flex-start!important; transform:none!important; }
            .hero .wrap { flex-direction:column!important; align-items:flex-start!important; justify-content:flex-start!important; gap:16px!important; }
            .hero-l { flex:1 1 auto!important; width:100%!important; min-width:0!important; }
            .h1 { font-size:clamp(34px,10vw,54px)!important; line-height:1.04!important; }
            .lead { font-size:14px!important; line-height:1.55!important; }
            .orbit { display:none!important; }
            .brief { display:flex!important; flex-direction:column!important; gap:10px!important; }
            .deliv { display:grid!important; }
            .mv { display:block!important; }
            .loop,.note { display:block!important; }
            .grid2,.out-grid { grid-template-columns:minmax(0,1fr)!important; gap:12px!important; }
            .mods,.exec { grid-template-columns:minmax(0,1fr)!important; gap:12px!important; }
            .mod>p,.xn>p { min-height:0!important; }
            .xn:not(:last-child)::after { content:"↓"; position:static!important; display:flex!important; align-items:center!important; justify-content:center!important; width:100%!important; height:22px!important; margin:12px 0 -4px!important; background:none!important; color:var(--teal)!important; font:800 18px Sora,sans-serif!important; }
            .loop { margin:16px auto 0!important; width:56px!important; height:20px!important; }
            .loop span { left:50%!important; width:180px!important; white-space:normal!important; text-align:center!important; line-height:1.35!important; }
            .note { font-size:12px!important; line-height:1.5!important; margin:24px auto 0!important; max-width:34em!important; text-align:center!important; }
            .hint,.handoff,.mobile-nav { display:none!important; }
            #spacer { display:none!important; width:0!important; height:0!important; }
            .dock { position:fixed!important; z-index:30!important; padding:0 8px calc(env(safe-area-inset-bottom,0px) + 6px)!important; }
            .dock-in { grid-template-columns:repeat(4,minmax(0,1fr))!important; gap:3px!important; padding:5px!important; border-radius:15px!important; }
            .cell { min-width:0!important; padding:5px 2px!important; flex-direction:column!important; align-items:center!important; text-align:center!important; gap:3px!important; border-radius:10px!important; }
            .cell .ic { width:20px!important; height:20px!important; padding:4px!important; border-radius:7px!important; }
            .cell b { font-size:9.5px!important; line-height:1.15!important; overflow-wrap:anywhere; }
            .cell small,.dlab { display:none!important; }
            .dcap { max-width:calc(100vw - 24px)!important; width:max-content!important; white-space:normal!important; text-align:center!important; font-size:10px!important; }
            .scene .wrap > * { max-width:100%; }
            .hero .metrics { display:grid; grid-template-columns:minmax(0,1fr); width:100%; }
            .hero .metrics>div { width:100%; }
            .shead { align-items:flex-start!important; gap:11px!important; margin-bottom:14px!important; }
            .shead h2 { font-size:clamp(22px,6.5vw,28px)!important; line-height:1.1!important; }
            .shead p { font-size:12px!important; line-height:1.4!important; }
            .steps li { transform:translateY(8px); }
            .steps li.in { transform:none; }
            .stamp { right:10px!important; bottom:10px!important; font-size:10px!important; }
            .fin { flex-direction:column!important; gap:18px!important; }
            .pw { --ph:min(42vh,340px); }
            .fin-r { max-width:none!important; width:100%!important; }
          }
          @media (max-width:390px) {
            .h1 { font-size:clamp(32px,9.6vw,44px)!important; }
            .scene:not(:last-child)::after { margin-top:14px; }
          }
          </style>'''

          idx = html.lower().rfind("</body>")
          if idx < 0:
              raise SystemExit("Não encontrei </body> no HTML da Thora.")
          html = html[:idx] + "\n" + mobile_css + "\n" + html[idx:]

          for required in ("mobileVertical", "function renderMobile", "flex-direction:column!important", "vh * .78"):
              if required not in html:
                  raise SystemExit("Falha ao inserir ajuste mobile: " + required)
          path.write_text(html, encoding="utf-8")
          print(f"HTML responsivo gerado: {path.stat().st_size} bytes")

          # Validação de sintaxe do JavaScript embutido antes da publicação.
          import re, subprocess
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("Nenhum script principal encontrado.")
          Path("/tmp/thora-inline.js").write_text(scripts[0], encoding="utf-8")
          subprocess.run(["node", "--check", "/tmp/thora-inline.js"], check=True)
          PY

          grep -q 'function renderMobile' dist/index.html
          echo "Build e sintaxe JavaScript OK: $(wc -c < dist/index.html) bytes"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
