name: Deploy Braindly to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate uploaded HTML
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<!doctype html>' index.html
          grep -qi 'Braindly' index.html
          grep -qi '</html>' index.html
          echo "Publishing provided index.html ($(wc -c < index.html) bytes)"

      - name: Prepare site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
